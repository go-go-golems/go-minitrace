schema: xgoja/v2
name: minitrace-jsverbs
app:
    name: minitrace-jsverbs
go:
    module: xgoja.generated/minitrace-jsverbs
    version: "1.26"
workspace:
    mode: auto
providers:
    - id: go-minitrace
      import: github.com/go-go-golems/go-minitrace/pkg/minitracejs/provider
      register: Register
      module:
        version: v0.0.0
        replace: ../../..
runtime:
    modules:
        - provider: go-minitrace
          name: minitrace
          as: minitrace
sources:
    - id: local
      kind: jsverbs
      from:
        dir: ./verbs
      language: javascript
commands:
    - id: verbs
      type: builtin.jsverbs
      name: verbs
      sources:
        - local
artifacts:
    - id: binary
      type: binary
      output: dist/minitrace-jsverbs
      sources:
        - local
