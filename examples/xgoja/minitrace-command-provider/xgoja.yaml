schema: xgoja/v2
name: minitrace-command-provider
app:
    name: minitrace-command-provider
go:
    module: xgoja.generated/minitrace-command-provider
    version: "1.26"
workspace:
    mode: auto
providers:
    - id: go-minitrace
      import: github.com/go-go-golems/go-minitrace/pkg/minitracejs/provider
      register: Register
      module:
        version: v0.0.0
        replace: ../../..
runtime:
    modules:
        - provider: go-minitrace
          name: minitrace
          as: minitrace
commands:
    - id: minitrace-queries
      type: provider.command-set
      name: queries
      mount: traces
      provider: go-minitrace
      config:
        appName: minitrace-command-provider-smoke
        queryRepositories:
            - ./queries
artifacts:
    - id: binary
      type: binary
      output: dist/minitrace-command-provider
