almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: CODEX-FIDELITY
      preset: micro
    - w: 1fr
      text: P5 START
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Final acceptance sweep
    preset: h1
    lines: 3
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - full build generation and lint
    - browser API and CLI smoke
    - fresh private source audits
    - docs receipts and completion audit
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '4'
    - - NEXT
      - single consolidated smoke
