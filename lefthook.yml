pre-commit:
  commands:
    lint:
      glob: '*.go'
      run: unset $(git rev-parse --local-env-vars); make lint
    test:
      glob: '*.go'
      run: unset $(git rev-parse --local-env-vars); make test
  parallel: true

pre-push:
  commands:
    release:
      run: make goreleaser
    lint:
      run: unset $(git rev-parse --local-env-vars); make lint
    test:
      run: unset $(git rev-parse --local-env-vars); make test
  parallel: true
