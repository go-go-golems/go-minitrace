syntax = "proto3";

package go_go_golems.minitrace.api.v1;

import "google/protobuf/struct.proto";
import "proto/go_go_golems/minitrace/api/v1/common.proto";

option go_package = "github.com/go-go-golems/go-minitrace/gen/proto/go_go_golems/minitrace/api/v1;apiv1";

message SessionSummary {
  string id = 1;
  string title = 2;
  optional string summary = 3;
  string classification = 4;
  SessionTiming timing = 5;
  SessionMetrics metrics = 6;
  SessionEnvironment environment = 7;
  SessionOperationalContext operational_context = 8;
}

message SessionSummaryDetail {
  string id = 1;
  string title = 2;
  optional string summary = 3;
  string classification = 4;
  SessionTiming timing = 5;
  SessionMetrics metrics = 6;
  SessionEnvironment environment = 7;
  SessionOperationalContext operational_context = 8;
  SessionProvenance provenance = 9;
  repeated SessionEvent events = 10;
  repeated SessionAttachment attachments = 11;
}

message ToolCallInput {
  optional string command = 1;
  google.protobuf.Struct arguments = 2;
  optional string file_path = 3;
}

message ToolCallOutput {
  bool success = 1;
  optional string result = 2;
  optional string error = 3;
  uint32 duration_ms = 4;
  bool truncated = 5;
}

message ToolCall {
  string id = 1;
  string tool_name = 2;
  string timestamp = 3;
  string operation_type = 4;
  ToolCallInput input = 5;
  ToolCallOutput output = 6;
  repeated ToolCallBadge badges = 7;
}

message TurnUsage {
  optional uint32 input_tokens = 1;
  optional uint32 output_tokens = 2;
  optional uint32 cache_read_tokens = 3;
  optional uint32 reasoning_tokens = 4;
}

message SessionEvent {
  string id = 1;
  string timestamp = 2;
  optional uint32 turn_index = 3;
  optional uint32 ordinal = 4;
  string kind = 5;
  string role = 6;
  optional string tool_call_id = 7;
  optional string annotation_id = 8;
  optional string attachment_id = 9;
  string title = 10;
  string summary = 11;
  string text = 12;
  string severity = 13;
  bool collapsed_by_default = 14;
  google.protobuf.Struct framework_metadata = 15;
}

message SessionAttachment {
  string id = 1;
  string timestamp = 2;
  string kind = 3;
  string name = 4;
  string media_type = 5;
  string path = 6;
  string url = 7;
  optional uint32 size_bytes = 8;
  string hash = 9;
  string content_ref = 10;
  string text_preview = 11;
  optional uint32 turn_index = 12;
  optional string tool_call_id = 13;
  optional string event_id = 14;
  google.protobuf.Struct framework_metadata = 15;
}

message Turn {
  uint32 idx = 1;
  string role = 2;
  string source = 3;
  string content = 4;
  string timestamp = 5;
  repeated ToolCall tool_calls_in_turn = 6;
  optional string thinking = 7;
  optional string model = 8;
  TurnUsage usage = 9;
}

message SessionBlock {
  uint32 block_num = 1;
  int32 user_turn_idx = 2;
  string user_ts = 3;
  string user_content = 4;
  uint32 agent_turns = 5;
  uint32 tool_calls = 6;
  optional double gap_minutes = 7;
  repeated Turn turns = 8;
  BlockArtifacts artifacts = 9;
}

message SessionDetail {
  string id = 1;
  string title = 2;
  optional string summary = 3;
  string classification = 4;
  SessionTiming timing = 5;
  SessionMetrics metrics = 6;
  SessionEnvironment environment = 7;
  SessionOperationalContext operational_context = 8;
  SessionProvenance provenance = 9;
  repeated SessionBlock blocks = 10;
  repeated SessionEvent events = 11;
  repeated SessionAttachment attachments = 12;
}

message ListSessionsResponse {
  ApiMeta meta = 1;
  repeated SessionSummary sessions = 2;
}

message GetSessionSummaryResponse {
  ApiMeta meta = 1;
  SessionSummaryDetail session = 2;
}

message GetSessionBlocksResponse {
  ApiMeta meta = 1;
  repeated SessionBlock blocks = 2;
}

message GetSessionDetailResponse {
  ApiMeta meta = 1;
  SessionDetail session = 2;
}
